version: '3.8'

services:
  server:
    image: node:20-alpine
    container_name: factory_planner_dev_server
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    command: npm run server
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/factory_planner_dev
      - NODE_ENV=development
    depends_on:
      - mongo
    networks:
      - factory_dev_network

  client:
    image: node:20-alpine
    container_name: factory_planner_dev_client
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - server
    networks:
      - factory_dev_network

  mongo:
    image: mongo:7.0
    container_name: factory_planner_dev_mongo
    ports:
      - "27017:27017"
    volumes:
      - dev_mongo_data:/data/db
    networks:
      - factory_dev_network

networks:
  factory_dev_network:
    driver: bridge

volumes:
  dev_mongo_data:
