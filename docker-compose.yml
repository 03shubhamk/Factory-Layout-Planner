version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factory_layout_planner_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/factory_planner
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5000
    depends_on:
      - mongo
    networks:
      - factory_network

  mongo:
    image: mongo:7.0
    container_name: factory_planner_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - factory_network

networks:
  factory_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
