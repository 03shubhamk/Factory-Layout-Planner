name: Code Quality & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Validate Syntax & Static Health
        run: |
          node --check server/server.js
          node --check server/routes/layoutRoutes.js
          node --check server/controllers/layoutController.js
